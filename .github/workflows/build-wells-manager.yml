name: Build Wells Manager Compact OneFile

on:
  push:
    branches: [wells-manager-compact]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WELLS MANAGER BETA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller python-docx

      - name: Validate active sources
        shell: pwsh
        run: |
          python -m py_compile Wells_Launcher.py
          python -m py_compile Wells_Launcher_Fixed.py
          python -m py_compile Wells_Launcher_Compact.py
          python -m py_compile Wells_Extractor/extractor_core.py
          python -m py_compile Wells_Revisor/wells_revisor_core.py
          python -m py_compile Wells_Revisor/wells_base_linguistica.py
          python -m py_compile Wells_Revisor/wells_guia_ptbr.py
          python -m py_compile Wells_Revisor/wells_isolador_renpy.py
          python -m py_compile Wells_SDK/sdk_core.py
          python -m py_compile Wells_SDK/dialogue_roundtrip.py
          python -m py_compile Wells_SDK/dialogue_manager.py
          python -m py_compile Wells_SDK/prepare_runtime.py
          python -m py_compile Wells_SDK/validate_manager_flow.py

      - name: Validate reviewer linguistic base
        shell: pwsh
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'Wells_Revisor'); from wells_base_linguistica import BaseLinguistica; b=BaseLinguistica(Path('Wells_Revisor')); assert b.palavras and b.lexico and b.conjugacoes and b.icf; print('Reviewer linguistic base OK:', len(b.palavras), len(b.lexico), len(b.conjugacoes), len(b.icf))"

      - name: Prepare internal Manager runtime
        run: python Wells_SDK/prepare_runtime.py

      - name: Validate Manager TXT DOCX round-trip
        shell: pwsh
        run: |
          $sdk = (Resolve-Path 'build_runtime/Wells_Runtime').Path
          $tutorial = (Resolve-Path '../renpy-7.4.11-sdk/tutorial').Path
          python Wells_SDK/validate_manager_flow.py "$sdk" "$tutorial"

      - name: Build single portable executable
        run: pyinstaller --noconfirm --clean Wells_Manager_Physical.spec

      - name: Verify exactly one distributable EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path 'dist/Wells_Manager.exe'
          $files = @(Get-ChildItem 'dist' -File)
          $dirs = @(Get-ChildItem 'dist' -Directory)
          if ($files.Count -ne 1) { throw "Esperado exatamente 1 arquivo em dist; encontrados $($files.Count)." }
          if ($dirs.Count -ne 0) { throw "Nenhuma pasta distributável era esperada em dist; encontradas $($dirs.Count)." }
          if ($exe.Path -ne $files[0].FullName) { throw 'O único arquivo gerado não é Wells_Manager.exe.' }
          if ($exe.Path -notlike '*.exe') { throw 'Executável final ausente.' }
          $hash = Get-FileHash $exe -Algorithm SHA256
          Get-Item $exe | Format-List Name,Length,FullName
          $hash | Format-List Algorithm,Hash
          Write-Host 'ONE-FILE validado: um único Wells_Manager.exe contém Gerenciador + Revisor + Ferramentas e suas dependências.'

      - name: Upload single executable
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Manager-Portable-OneFile
          path: WELLS MANAGER BETA/dist/Wells_Manager.exe
          if-no-files-found: error
