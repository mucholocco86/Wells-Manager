name: Build Wells Manager

on:
  push:
    branches: [wells-manager-core]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WELLS MANAGER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller python-docx

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m py_compile Wells_SDK/sdk_core.py

      - name: Build Wells Manager
        run: pyinstaller --noconfirm --clean Wells_Manager.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Wells_Manager.exe')) { throw 'Wells_Manager.exe não foi gerado.' }
          Get-Item 'dist/Wells_Manager.exe' | Format-List Name,Length,FullName

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Manager-Windows
          path: WELLS MANAGER/dist/Wells_Manager.exe
          if-no-files-found: error
