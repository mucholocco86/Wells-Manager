name: Build Wells Manager Beta

on:
  push:
    branches: [wells-manager-beta]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WELLS MANAGER BETA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller python-docx

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m py_compile Wells_SDK/sdk_core.py
          python -m py_compile Wells_SDK/prepare_runtime.py

      - name: Prepare reduced RenPy runtime
        run: python Wells_SDK/prepare_runtime.py

      - name: Validate reduced runtime with RenPy tutorial
        shell: pwsh
        run: |
          $sdk = Resolve-Path 'build_runtime/renpy-7.4.11-sdk'
          $tutorialSource = Resolve-Path '../renpy-7.4.11-sdk/tutorial'
          $tutorial = Join-Path $env:RUNNER_TEMP 'wells-renpy-tutorial-test'
          if (Test-Path $tutorial) { Remove-Item $tutorial -Recurse -Force }
          Copy-Item $tutorialSource $tutorial -Recurse

          if (Test-Path "$sdk/launcher") { throw 'Launcher ainda presente no runtime reduzido.' }
          if (Test-Path "$sdk/doc") { throw 'Documentação ainda presente no runtime reduzido.' }
          foreach ($removed in @('linux-i686','linux-x86_64','mac-x86_64','windows-i686')) {
            if (Test-Path "$sdk/lib/$removed") { throw "Plataforma removida reapareceu: $removed" }
          }
          foreach ($required in @('renpy.exe','renpy/common','renpy/translation','lib/python2.7','lib/windows-x86_64')) {
            if (-not (Test-Path "$sdk/$required")) { throw "Dependência necessária ausente: $required" }
          }

          $version = (& "$sdk/renpy.exe" --version 2>&1 | Out-String).Trim()
          Write-Host $version
          if ($version -notmatch "Ren'Py 7\.4\.11") { throw "Runtime reduzido não iniciou corretamente: $version" }

          function Invoke-RenPy([string[]]$Arguments) {
            Write-Host ('RenPy tutorial test: ' + ($Arguments -join ' '))
            & "$sdk/renpy.exe" $tutorial @Arguments
            if ($LASTEXITCODE -ne 0) { throw "Falha no comando RenPy: $($Arguments -join ' ')" }
          }

          # Exercise the same real project-command path used by Wells Manager.
          Invoke-RenPy @('lint', (Join-Path $tutorial 'wells_lint.txt'))
          if (-not (Test-Path (Join-Path $tutorial 'wells_lint.txt'))) { throw 'Lint não gerou relatório.' }

          Invoke-RenPy @('dialogue')
          if (-not (Test-Path (Join-Path $tutorial 'dialogue.tab'))) { throw 'Extração TAB não gerou dialogue.tab.' }
          Remove-Item (Join-Path $tutorial 'dialogue.tab') -Force

          Invoke-RenPy @('dialogue','--text')
          if (-not (Test-Path (Join-Path $tutorial 'dialogue.txt'))) { throw 'Extração TXT não gerou dialogue.txt.' }

          Invoke-RenPy @('translate','wells_test','--empty')
          $translationDir = Join-Path $tutorial 'game/tl/wells_test'
          if (-not (Test-Path $translationDir)) { throw 'Geração de traduções não criou game/tl/wells_test.' }
          $translationFiles = @(Get-ChildItem $translationDir -Filter '*.rpy' -Recurse -ErrorAction SilentlyContinue)
          if ($translationFiles.Count -eq 0) { throw 'Geração de traduções não criou arquivos .rpy.' }

          Invoke-RenPy @('compile')
          $compiled = @(Get-ChildItem (Join-Path $tutorial 'game') -Filter '*.rpyc' -Recurse -ErrorAction SilentlyContinue)
          if ($compiled.Count -eq 0) { throw 'Forçar recompilação não produziu arquivos .rpyc.' }

          Invoke-RenPy @('rmpersistent')
          Write-Host 'Tutorial validation completed: lint, dialogue TAB/TXT, translations, compile and persistent cleanup passed.'

      - name: Build Wells Manager Beta
        run: pyinstaller --noconfirm --clean Wells_Manager.spec

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Wells_Manager.exe')) { throw 'Wells_Manager.exe não foi gerado.' }
          $exe = Get-Item 'dist/Wells_Manager.exe'
          if ($exe.Length -lt 1000000) { throw 'Executável gerado é inesperadamente pequeno.' }
          $exe | Format-List Name,Length,FullName

      - name: Upload beta build
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Manager-Beta-Windows
          path: WELLS MANAGER BETA/dist/Wells_Manager.exe
          if-no-files-found: error
