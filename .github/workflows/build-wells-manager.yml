name: Build Wells Manager Beta

on:
  push:
    branches: [wells-manager-beta]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WELLS MANAGER BETA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller python-docx

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -m py_compile Wells_Extractor/extractor_core.py
          python -m py_compile Wells_Translator/wells_translator_core.py
          python -m py_compile Wells_Revisor/wells_revisor_core.py
          python -m py_compile Wells_Revisor/wells_base_linguistica.py
          python -m py_compile Wells_Revisor/wells_guia_ptbr.py
          python -m py_compile Wells_Revisor/wells_isolador_renpy.py
          python -m py_compile Wells_SDK/sdk_core.py
          python -m py_compile Wells_SDK/prepare_runtime.py
          python -m py_compile Wells_SDK/validate_tutorial.py

      - name: Validate reviewer linguistic base
        shell: pwsh
        run: |
          python -c "import sys; from pathlib import Path; sys.path.insert(0,'Wells_Revisor'); from wells_base_linguistica import BaseLinguistica; b=BaseLinguistica(Path('Wells_Revisor')); assert b.palavras and b.lexico and b.conjugacoes and b.icf; print('Reviewer linguistic base OK:', len(b.palavras), len(b.lexico), len(b.conjugacoes), len(b.icf))"

      - name: Prepare reduced RenPy runtime
        run: python Wells_SDK/prepare_runtime.py

      - name: Validate reduced runtime structure
        shell: pwsh
        run: |
          $sdk = Resolve-Path 'build_runtime/renpy-7.4.11-sdk'
          if (Test-Path "$sdk/launcher") { throw 'Launcher ainda presente no runtime reduzido.' }
          if (Test-Path "$sdk/doc") { throw 'Documentação ainda presente no runtime reduzido.' }
          foreach ($removed in @('linux-i686','linux-x86_64','mac-x86_64','windows-i686')) {
            if (Test-Path "$sdk/lib/$removed") { throw "Plataforma removida reapareceu: $removed" }
          }
          foreach ($required in @('renpy.exe','renpy/common','renpy/translation','lib/python2.7','lib/windows-x86_64')) {
            if (-not (Test-Path "$sdk/$required")) { throw "Dependência necessária ausente: $required" }
          }
          $version = (& "$sdk/renpy.exe" --version 2>&1 | Out-String).Trim()
          Write-Host $version
          if ($version -notmatch "Ren'Py 7\.4\.11") { throw "Runtime reduzido não iniciou corretamente: $version" }

      - name: Functional test through Wells SDK bridge
        shell: pwsh
        run: |
          $sdk = (Resolve-Path 'build_runtime/renpy-7.4.11-sdk').Path
          $tutorial = (Resolve-Path '../renpy-7.4.11-sdk/tutorial').Path
          python Wells_SDK/validate_tutorial.py "$sdk" "$tutorial"

      - name: Build Wells Manager Beta
        run: pyinstaller --noconfirm --clean Wells_Manager.spec

      - name: Verify packaged Wells resources
        shell: pwsh
        run: |
          $listing = (pyi-archive_viewer -l 'dist/Wells_Manager.exe' | Out-String)
          $normalized = $listing.Replace('\', '/')
          foreach ($required in @(
            'Wells_Extractor/extractor_core.py',
            'Wells_Extractor/unrpyc/unrpyc.py',
            'Wells_Translator/wells_translator_core.py',
            'Wells_Revisor/wells_revisor_core.py',
            'Wells_Revisor/Palavras_PT-BR.txt',
            'Wells_Revisor/dados_linguisticos/fserb_icf.csv',
            'Wells_SDK/sdk_core.py',
            'renpy-7.4.11-sdk/renpy.exe'
          )) {
            if (-not $normalized.Contains($required)) { throw "Recurso obrigatório ausente do EXE: $required" }
          }
          $dictionaryCopies = [regex]::Matches($normalized, [regex]::Escape('Palavras_PT-BR.txt')).Count
          if ($dictionaryCopies -ne 1) { throw "Esperada 1 cópia do dicionário PT-BR; encontradas: $dictionaryCopies" }
          if ($normalized.Contains('Wells_SDK/prepare_runtime.py') -or $normalized.Contains('Wells_SDK/validate_tutorial.py')) {
            throw 'Scripts exclusivos do laboratório entraram no executável.'
          }
          Write-Host 'Recursos físicos do Wells validados; dicionário PT-BR presente uma única vez.'

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Wells_Manager.exe')) { throw 'Wells_Manager.exe não foi gerado.' }
          $exe = Get-Item 'dist/Wells_Manager.exe'
          if ($exe.Length -lt 1000000) { throw 'Executável gerado é inesperadamente pequeno.' }
          $exe | Format-List Name,Length,FullName

      - name: Upload beta build
        uses: actions/upload-artifact@v4
        with:
          name: Wells-Manager-Beta-Windows
          path: WELLS MANAGER BETA/dist/Wells_Manager.exe
          if-no-files-found: error
